<!doctype html>
<!-- Supabase Auth template (Pareezay.Hub). Paste into Dashboard > Authentication >
     Email Templates. Requires custom SMTP. {{ .Token }} is the 6-digit code. -->
<html><body style="margin:0;background:#f6f3ee;font-family:Arial,Helvetica,sans-serif;color:#1E1E1E">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding:32px 16px">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#fff;border-radius:10px">
<tr><td style="padding:24px 32px;border-bottom:2px solid #B8893B;font-size:22px;letter-spacing:1px;font-weight:700">PAREEZAY<span style="color:#B8893B">.HUB</span></td></tr>
<tr><td style="padding:28px 32px;font-size:15px;line-height:1.6">
<h1 style="margin:0 0 12px;font-size:19px">Your sign-in code</h1>
<p style="margin:0 0 20px">Use this code to sign in to Pareezay.Hub:</p>
<p style="margin:0 0 20px;font-size:32px;font-weight:700;letter-spacing:8px;text-align:center;background:#faf6ef;border:1px solid #eadcc2;border-radius:8px;padding:16px 0">{{ .Token }}</p>
<p style="margin:0;color:#555;font-size:13px">The code expires in 1 hour. If you did not try to sign in, you can ignore this email.</p>
</td></tr>
<tr><td style="padding:18px 32px;font-size:12px;color:#888;border-top:1px solid #eee">Never share this code. Pareezay.Hub staff will never ask for it.</td></tr>
</table></td></tr></table>
</body></html>
